name: CI

# Typecheck and the full test suite on every push and pull request. The engine
# is pure client-side TypeScript with seeded dealing, so the suite is
# deterministic and needs no services.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Skip the OG bot's own commits — they never touch source.
    if: ${{ !startsWith(github.event.head_commit.message, '[og-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + engine tests
        run: npm test
